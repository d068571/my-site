<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luzern weather</title>
  <meta name="description" content="Live weather for Luzern, Switzerland: current conditions, the next 24 hours and the week ahead.">
  <meta name="theme-color" content="#2a64ad">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23123447'/%3E%3Cpath d='M3 24 11 13l3 3 4-8 5 7 6 9z' fill='%2393c8ec'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #2a64ad; --sky-bot: #93c8ec;
      --far: #6f93b3; --near: #2f4c62; --shore: #1c3344;
      --lake-top: #3d7fa0; --lake-bot: #10293a;
      --ink: #f6f9fc; --ink-shadow: 0 1px 14px rgba(0, 0, 0, .22);
      --cloud: 255, 255, 255; --ca: .85;
      --haze-c: 205, 210, 213; --haze: 0; --stars: 0;
      --text: #eef3f6; --muted: rgba(238, 243, 246, .66); --line: rgba(238, 243, 246, .13);
      --rain: #8ecbff;
      --display: "Anybody", "Arial Narrow", sans-serif;
      --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background-color: var(--lake-bot);
      color: var(--text);
      font: 400 17px/1.5 var(--sans);
      transition: background-color 1.2s ease;
    }

    /* ---------- Scene ---------- */
    .hero {
      position: relative;
      height: max(580px, 84svh);
      overflow: hidden;
      isolation: isolate;
    }
    .sky {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, var(--sky-top), var(--sky-bot) 78%);
    }
    .stars { position: absolute; inset: 0; opacity: var(--stars); transition: opacity 1.5s; }
    .star {
      position: absolute; border-radius: 50%; background: #fff;
      animation: twinkle var(--tw) ease-in-out infinite alternate;
      animation-delay: var(--td);
    }
    @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }

    .orb { position: absolute; left: 0; top: 0; pointer-events: none; transition: opacity 1.5s; }
    .sun {
      width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 50%;
      background: radial-gradient(circle closest-side, #fffbea 0 7%, #ffe7ad 10%, rgba(255, 222, 150, .42) 13%, rgba(255, 226, 160, .16) 30%, rgba(255, 226, 160, .05) 60%, rgba(255, 226, 160, 0) 100%);
    }
    .moon { width: 34px; height: 34px; margin: -17px 0 0 -17px; filter: drop-shadow(0 0 14px rgba(240, 238, 225, .45)); }

    .clouds { position: absolute; inset: 0; }
    .cloud {
      position: absolute; left: 0;
      top: var(--t); width: var(--w); height: calc(var(--w) * .34);
      opacity: var(--ca);
      background:
        radial-gradient(closest-side at 26% 64%, rgb(var(--cloud)) 0 50%, rgba(var(--cloud), 0)),
        radial-gradient(closest-side at 52% 42%, rgb(var(--cloud)) 0 56%, rgba(var(--cloud), 0)),
        radial-gradient(closest-side at 78% 62%, rgb(var(--cloud)) 0 48%, rgba(var(--cloud), 0));
      filter: blur(9px);
      animation: drift var(--d) linear infinite;
      animation-delay: var(--dl);
      transition: opacity 1.5s;
    }
    @keyframes drift {
      from { transform: translateX(calc(-100% - 5vw)); }
      to { transform: translateX(105vw); }
    }

    .land {
      position: absolute; left: 0; bottom: 0; display: block;
      width: 100%; height: clamp(300px, 30vw, 440px);
    }
    .land .far { fill: var(--far); transition: fill 1.2s; }
    .land .near { fill: var(--near); transition: fill 1.2s; }
    .land .shore { fill: var(--shore); transition: fill 1.2s; }
    .land .bridge { stroke: var(--shore); transition: stroke 1.2s; }
    .land .snowcap { fill: #f3f6f9; opacity: 0; transition: opacity 1.2s; }
    .shim { stroke: rgba(255, 255, 255, .13); stroke-width: 1; animation: shimmer 7s ease-in-out infinite alternate; }
    .shim:nth-child(2n) { animation-duration: 9s; animation-delay: -3s; }
    @keyframes shimmer { from { transform: translateX(-8px); } to { transform: translateX(8px); } }

    .haze {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom, rgba(var(--haze-c), 0) 22%, rgba(var(--haze-c), .9) 66%, rgba(var(--haze-c), .3) 100%);
      opacity: var(--haze); transition: opacity 1.5s;
    }
    .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .flash { position: absolute; inset: 0; background: #eef2ff; opacity: 0; pointer-events: none; }

    /* ---------- Current conditions ---------- */
    .now {
      position: relative; z-index: 5;
      max-width: 760px; margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 22px 0;
      color: var(--ink); text-shadow: var(--ink-shadow);
      transition: color 1.2s;
    }
    .place { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0; }
    .place h1 { margin: 0; font: 600 1.125rem/1.2 var(--sans); letter-spacing: .01em; }
    .clock { font-size: .9375rem; opacity: .8; font-variant-numeric: tabular-nums; }
    .temp {
      margin: 20px 0 0 -.04em;
      font-family: var(--display);
      font-weight: 720; font-stretch: 58%;
      font-size: clamp(8.5rem, 42vw, 15rem);
      line-height: .8; letter-spacing: -.035em;
      font-variant-numeric: tabular-nums;
    }
    .cond { margin: 18px 0 0; font-size: 1.3125rem; font-weight: 500; line-height: 1.25; }
    .range { margin: 6px 0 0; font-size: 1rem; opacity: .82; }

    /* ---------- Content ---------- */
    main { max-width: 760px; margin: 0 auto; padding: 18px 22px 40px; }
    section { margin-top: 34px; }
    section:first-child { margin-top: 8px; }
    h2 { margin: 0 0 14px; font: 600 1.0625rem/1.3 var(--sans); }

    .notice {
      display: none; margin-top: 8px; padding: 16px 18px;
      border-left: 3px solid var(--rain); background: rgba(255, 255, 255, .05);
    }
    .notice.show { display: block; }
    .notice p { margin: 0 0 12px; }

    .strip {
      overflow-x: auto; margin: 0 -22px; padding: 0 22px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .strip::-webkit-scrollbar { display: none; }
    .strip svg { display: block; }
    .strip text { font-family: var(--sans); }

    .week { list-style: none; margin: 0; padding: 0; }
    .day {
      display: grid; align-items: center;
      grid-template-columns: 3.6rem 26px 2.4rem 2.1rem 1fr 2.1rem;
      gap: 10px; padding: 11px 0;
      border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    .day:last-child { border-bottom: 1px solid var(--line); }
    .day .name { font-weight: 500; }
    .day .pop { color: var(--rain); font-size: .875rem; }
    .day .lo { color: var(--muted); text-align: right; }
    .day .hi { text-align: right; font-weight: 500; }
    .ic { width: 26px; height: 26px; display: block; color: var(--text); }
    .bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .09); }
    .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
    .dot {
      position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 0 2px var(--lake-bot);
      transform: translate(-50%, -50%);
    }

    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 18px; margin: 0; }
    .facts div { min-width: 0; }
    .facts dt { color: var(--muted); font-size: .875rem; }
    .facts dd { margin: 2px 0 0; }
    .val {
      font-family: var(--display); font-weight: 600; font-stretch: 80%;
      font-size: 1.75rem; line-height: 1.1; font-variant-numeric: tabular-nums;
      display: flex; align-items: center;
    }
    .val small { font-family: var(--sans); font-size: .9375rem; font-weight: 500; margin-left: 3px; }
    .sub { display: block; color: var(--muted); font-size: .875rem; margin-top: 2px; }
    .arrow { width: 22px; height: 22px; margin-left: 8px; transition: transform .6s; }

    footer {
      margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
      color: var(--muted); font-size: .875rem;
    }
    footer p { margin: 0; }
    a { color: var(--text); text-underline-offset: 3px; }
    button {
      font: 500 .9375rem var(--sans); color: var(--text);
      background: rgba(255, 255, 255, .08); border: 1px solid var(--line);
      border-radius: 999px; padding: 8px 16px; cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, .14); }
    :focus-visible { outline: 2px solid var(--rain); outline-offset: 3px; }

    @media (min-width: 720px) {
      .facts { grid-template-columns: repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud { animation: none; transform: translateX(var(--x)); }
      .star, .shim { animation: none; }
    }
  </style>
</head>
<body>

      <symbol id="i-thunder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 7.1 6.1 4.5 4.5 0 0 0 7 15z"/><path d="M13 16l-2.6 3.6h3.4l-2.4 3.4"/></symbol>

  </svg>

  <header class="hero" id="hero">
    <div class="sky"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="orb sun" id="sun" aria-hidden="true" style="opacity:0"></div>
    <svg class="orb moon" id="moon" viewBox="0 0 34 34" aria-hidden="true" style="opacity:0">
      <circle cx="17" cy="17" r="16" fill="rgba(255,255,255,.07)"/>
      <path id="moon-lit" fill="#f3f1e6" d=""/>
    </svg>
    <div class="clouds" id="clouds" aria-hidden="true"></div>

    <svg class="land" id="land" viewBox="0 0 800 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--lake-top)"/>
          <stop offset="1" style="stop-color:var(--lake-bot)"/>
        </linearGradient>
        <radialGradient id="glint-g">
          <stop offset="0" stop-color="#fff6dc" stop-opacity=".9"/>
          <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>

          <stop offset="0" stop-color="#fff"/>

        <mask id="lake-fade" maskUnits="userSpaceOnUse" x="0" y="150" width="800" height="70">
          <rect x="0" y="150" width="800" height="62" fill="url(#fade-g)"/>

  <main>

<script>
(() => {
  const API = 'https://api.open-meteo.com/v1/forecast?latitude=47.0502&longitude=8.3093' +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m' +
    '&hourly=temperature_2m,precipitation_probability,weather_code,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,uv_index_max' +
    '&timezone=Europe%2FZurich&forecast_days=7';
  const TZ = 'Europe/Zurich';
  const REFRESH_MS = 10 * 60 * 1000;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  let data = null, fetchedAt = 0, sceneKey = '';

  /* ---------- Time helpers (all in Luzern local time, as UTC-epoch numbers) ---------- */
  const partsFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  function nowLocal() {
    const p = Object.fromEntries(partsFmt.formatToParts(new Date()).map(x => [x.type, x.value]));
    return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
  }
  const parseLocal = s => Date.parse((s.length === 10 ? s + 'T00:00' : s) + ':00Z');
  const hhmm = s => s.slice(11, 16);
  const clockFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'long', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const dayFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'short' });
  const round = t => Math.round(t) || 0;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ---------- Weather codes ---------- */
  const WMO = {
    0: 'Clear sky', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast',
    45: 'Fog', 48: 'Freezing fog',
    51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle',
    61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Heavy freezing rain',
    71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains',
    80: 'Rain showers', 81: 'Heavy showers', 82: 'Violent showers',
    85: 'Snow showers', 86: 'Heavy snow showers',
    95: 'Thunderstorm', 96: 'Thunderstorm with hail', 99: 'Thunderstorm with hail'
  };
  function kind(c) {
    if (c <= 1) return 'clear';
    if (c === 2) return 'partly';
    if (c === 3) return 'cloud';
    if (c === 45 || c === 48) return 'fog';
    if (c >= 51 && c <= 57) return 'drizzle';
    if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
    if (c >= 95) return 'thunder';
    return 'cloud';
  }
  function iconId(c, day) {
    const k = kind(c);
    if (k === 'clear') return day ? 'i-sun' : 'i-moon';
    if (k === 'partly') return day ? 'i-sun-cloud' : 'i-moon-cloud';
    return { cloud: 'i-cloud', fog: 'i-fog', drizzle: 'i-drizzle', rain: 'i-rain', snow: 'i-snow', thunder: 'i-thunder' }[k];
  }
  const icon = (c, day, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#${iconId(c, day)}"/></svg>`;
  const PRECIP = { 51: 50, 53: 80, 55: 110, 56: 60, 57: 90, 61: 90, 63: 150, 65: 230, 66: 90, 67: 160, 80: 100, 81: 170, 82: 250, 95: 180, 96: 200, 99: 240 };
  const SNOWFALL = { 71: 60, 73: 110, 75: 180, 77: 50, 85: 90, 86: 170 };

  /* ---------- Scene themes ---------- */
  const THEMES = {
    clear:   { skyT: '#2a64ad', skyB: '#93c8ec', far: '#6f93b3', near: '#2f4c62', shore: '#1c3344', lakeT: '#3d7fa0', lakeB: '#10293a', ink: '#f6f9fc', cloud: '255,255,255', ca: .85, stars: 0, haze: 0, hazeC: '205,210,213' },
    dusk:    { skyT: '#2e3470', skyB: '#f0a36e', far: '#6c5f8a', near: '#2b2a4d', shore: '#1b1a33', lakeT: '#76628a', lakeB: '#171731', ink: '#fbf6f2', cloud: '255,214,196', ca: .7, stars: .2, haze: 0, hazeC: '205,190,200' },
    cloudy:  { skyT: '#5a6a7c', skyB: '#a9b5c1', far: '#7c8996', near: '#3a4653', shore: '#26303a', lakeT: '#506473', lakeB: '#16212b', ink: '#f6f8fa', cloud: '236,240,244', ca: .9, stars: 0, haze: .15, hazeC: '196,203,210' },
    rain:    { skyT: '#3b4652', skyB: '#73808c', far: '#5b6772', near: '#2b343d', shore: '#1c232a', lakeT: '#3c4b57', lakeB: '#121920', ink: '#f4f7f9', cloud: '150,160,172', ca: .9, stars: 0, haze: .35, hazeC: '140,150,160' },
    storm:   { skyT: '#232835', skyB: '#4b5263', far: '#3e4555', near: '#1e232d', shore: '#13171e', lakeT: '#2c3340', lakeB: '#0c0f14', ink: '#f4f6f9', cloud: '90,98,114', ca: .95, stars: 0, haze: .3, hazeC: '90,98,112' },
    snow:    { skyT: '#7a8ca1', skyB: '#cbd5df', far: '#aab7c5', near: '#5d6d7e', shore: '#3e4b58', lakeT: '#6c8294', lakeB: '#1d2a36', ink: '#13202b', cloud: '240,244,248', ca: .9, stars: 0, haze: .35, hazeC: '225,231,237' },
    fog:     { skyT: '#8c969e', skyB: '#c4cacd', far: '#aeb5ba', near: '#727d85', shore: '#58626a', lakeT: '#8a949b', lakeB: '#2b343b', ink: '#16212a', cloud: '220,224,227', ca: .8, stars: 0, haze: 1, hazeC: '205,210,213' },
    night:   { skyT: '#060a1c', skyB: '#1c2a55', far: '#1c2546', near: '#0b1022', shore: '#070a17', lakeT: '#17224a', lakeB: '#050813', ink: '#eef2fb', cloud: '60,68,90', ca: .8, stars: 1, haze: 0, hazeC: '40,48,70' },
    nightCloudy: { skyT: '#10141d', skyB: '#2a313f', far: '#222935', near: '#0e1218', shore: '#090c11', lakeT: '#1f2632', lakeB: '#07090d', ink: '#eef1f5', cloud: '58,64,78', ca: .9, stars: 0, haze: .15, hazeC: '70,76,88' }
  };
  const LIGHT_INK = new Set(['snow', 'fog']);

  function applyTheme(name, hazeOverride) {
    const t = THEMES[name];
    const set = (k, v) => root.style.setProperty(k, v);
    set('--sky-top', t.skyT); set('--sky-bot', t.skyB);
    set('--far', t.far); set('--near', t.near); set('--shore', t.shore);
    set('--lake-top', t.lakeT); set('--lake-bot', t.lakeB);
    set('--ink', t.ink);
    set('--ink-shadow', LIGHT_INK.has(name) ? '0 1px 12px rgba(255,255,255,.35)' : '0 1px 14px rgba(0,0,0,.22)');
    set('--cloud', t.cloud); set('--ca', t.ca);
    set('--stars', t.stars);
    set('--haze', hazeOverride ?? t.haze); set('--haze-c', t.hazeC);
    document.querySelector('meta[name="theme-color"]').content = t.skyT;
  }

  /* ---------- Static scene pieces ---------- */
  (function buildStars() {
    const box = $('stars'); let html = '';
    for (let i = 0; i < 90; i++) {
      const s = (Math.random() * 1.4 + .8).toFixed(1);
      html += `<i class="star" style="left:${(Math.random() * 100).toFixed(2)}%;top:${(Math.random() * 62).toFixed(2)}%;width:${s}px;height:${s}px;--tw:${(2 + Math.random() * 4).toFixed(1)}s;--td:-${(Math.random() * 6).toFixed(1)}s"></i>`;
    }
    box.innerHTML = html;
  })();
  (function buildBridge() {
    let d = 'M400 190L800 184';
    for (let x = 404; x <= 800; x += 13) {
      const y = 184 - (x - 400) * 6 / 400;
      d += `M${x} ${y.toFixed(1)}v6.5`;
    }
    $('bridge').innerHTML = `<path d="${d}"/>`;
  })();

  function buildClouds(n) {
    let html = '';
    for (let i = 0; i < n; i++) {
      const w = 200 + Math.random() * 260;
      const dur = 150 + Math.random() * 140;
      html += `<div class="cloud" style="--t:${(3 + Math.random() * 40).toFixed(1)}%;--w:${w.toFixed(0)}px;--d:${dur.toFixed(0)}s;--dl:-${(Math.random() * dur).toFixed(0)}s;--x:${(Math.random() * 90 - 10).toFixed(0)}vw"></div>`;
    }
    $('clouds').innerHTML = html;
  }

  /* ---------- Sun, moon and lake glint ---------- */
  function noonAltitude(epoch) {
    const d = new Date(epoch);
    const doy = Math.floor((epoch - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
    const decl = 23.44 * Math.sin(2 * Math.PI * (284 + doy) / 365);
    return 90 - 47.05 + decl;
  }
  function moonPhase(epoch) {
    const ref = Date.UTC(2000, 0, 6, 18, 14);
    const syn = 29.530588853;
    return (((epoch - ref) / 864e5) % syn + syn) % syn / syn;
  }
  function moonPath(p) {
    const r = 16, cx = 17, cy = 17, rx = Math.abs(Math.cos(2 * Math.PI * p)) * r;
    if (p < .5) return `M${cx} ${cy - r}A${r} ${r} 0 0 1 ${cx} ${cy + r}A${rx.toFixed(2)} ${r} 0 0 ${p < .25 ? 0 : 1} ${cx} ${cy - r}Z`;
    return `M${cx} ${cy - r}A${r} ${r} 0 0 0 ${cx} ${cy + r}A${rx.toFixed(2)} ${r} 0 0 ${p < .75 ? 0 : 1} ${cx} ${cy - r}Z`;
  }

  let orb = null; // { el, f, height, opacity, glint }
  function placeOrb() {
    const sun = $('sun'), moon = $('moon'), glint = $('glint');
    if (!orb) { sun.style.opacity = 0; moon.style.opacity = 0; glint.setAttribute('opacity', 0); return; }
    const hero = $('hero'), land = $('land');
    const W = hero.clientWidth, H = hero.clientHeight, LH = land.clientHeight;
    const s = Math.max(W / 800, LH / 220);
    const horizon = H - 70 * s;
    const x = W * (.12 + .76 * orb.f);
    const top = Math.max(150, horizon * .3);
    const y = horizon - Math.sin(Math.PI * orb.f) * (horizon - top) * orb.height;
    const other = orb.el === sun ? moon : sun;
    other.style.opacity = 0;
    orb.el.style.transform = `translate(${x}px, ${y}px)`;
    orb.el.style.opacity = orb.opacity;
    const svgX = (x - (W - 800 * s) / 2) / s;
    glint.setAttribute('cx', svgX.toFixed(1));
    glint.setAttribute('opacity', (orb.opacity * orb.glint).toFixed(2));
  }

  /* ---------- Rain and snow ---------- */
  const canvas = $('fx'), ctx = canvas.getContext('2d');
  let fx = { mode: null, count: 0, wind: 0 }, drops = [], raf = 0, cw = 0, ch = 0;
  function sizeCanvas() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cw = canvas.clientWidth; ch = canvas.clientHeight;
    canvas.width = cw * dpr; canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function newDrop(anyY) {
    const x = Math.random() * (cw + 160) - 80;
    const y = anyY ? Math.random() * ch : -20 - Math.random() * 40;
    return fx.mode === 'rain'
      ? { x, y, len: 10 + Math.random() * 14, v: 9 + Math.random() * 7 }
      : { x, y, r: .8 + Math.random() * 1.8, v: .5 + Math.random() * 1.1, ph: Math.random() * 6.28 };
  }
  function setFx(mode, count, wind) {
    fx = { mode, count, wind };
    sizeCanvas();
    drops = Array.from({ length: count }, () => newDrop(true));
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function frame(t) {
    ctx.clearRect(0, 0, cw, ch);
    if (!fx.mode) { raf = 0; return; }
    const move = !reduceMotion;
    if (fx.mode === 'rain') {
      ctx.strokeStyle = 'rgba(214,230,246,.42)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        if (move) { d.y += d.v; d.x += fx.wind * d.v; if (d.y - d.len > ch) drops[i] = newDrop(false); }
        ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - fx.wind * d.len, d.y - d.len);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.beginPath();
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        if (move) { d.y += d.v; d.x += Math.sin(t / 1100 + d.ph) * .45 + fx.wind * 1.2; if (d.y > ch + 4) drops[i] = newDrop(false); }
        ctx.moveTo(d.x + d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    raf = move ? requestAnimationFrame(frame) : 0;
  }

  let flashTimer = 0;
  function lightning(on) {
    clearTimeout(flashTimer);
    if (!on || reduceMotion) return;
    const strike = () => {
      $('flash').animate([{ opacity: 0 }, { opacity: .5 }, { opacity: .08 }, { opacity: .35 }, { opacity: 0 }], { duration: 650, easing: 'ease-out' });
      flashTimer = setTimeout(strike, 3500 + Math.random() * 7000);
    };
    flashTimer = setTimeout(strike, 1500 + Math.random() * 3000);
  }

  /* ---------- Scene from current conditions ---------- */
  function updateScene() {
    const c = data.current, d = data.daily;
    const code = c.weather_code, k = kind(code), cover = c.cloud_cover ?? 50;
    const now = nowLocal();
    const sr = parseLocal(d.sunrise[0]), ss = parseLocal(d.sunset[0]);
    const isDay = now >= sr && now < ss;
    const nearTwilight = Math.abs(now - sr) < 50 * 6e4 || Math.abs(now - ss) < 50 * 6e4;

    let theme, hazeOverride;
    if (k === 'thunder') theme = 'storm';
    else if (k === 'fog') { theme = isDay ? 'fog' : 'nightCloudy'; if (!isDay) hazeOverride = .8; }
    else if (k === 'snow') theme = isDay ? 'snow' : 'nightCloudy';
    else if (k === 'rain' || k === 'drizzle') theme = isDay ? 'rain' : 'nightCloudy';
    else if (nearTwilight && code <= 2) theme = 'dusk';
    else if (isDay) theme = (code === 3 || cover > 75) ? 'cloudy' : 'clear';
    else theme = (code === 3 || cover > 75) ? 'nightCloudy' : 'night';
    applyTheme(theme, hazeOverride);

    const month = new Date(now).getUTCMonth();
    $('snowcap').style.opacity = (k === 'snow' || month >= 10 || month <= 3) ? .85 : 0;

    let clouds = Math.round(cover / 100 * 7);
    if (['rain', 'drizzle', 'snow', 'thunder'].includes(k) || code === 3) clouds = Math.max(clouds, 6);
    if (k === 'fog') clouds = 2;
    const key = theme + clouds;
    if (key !== sceneKey) { buildClouds(clouds); sceneKey = key; }

    const precipCount = PRECIP[code], snowCount = SNOWFALL[code];
    const wind = clamp(-Math.sin(c.wind_direction_10m * Math.PI / 180) * c.wind_speed_10m / 60, -.5, .5);
    if (precipCount) { if (fx.mode !== 'rain' || fx.count !== precipCount) setFx('rain', precipCount, wind); else fx.wind = wind; }
    else if (snowCount) { if (fx.mode !== 'snow' || fx.count !== snowCount) setFx('snow', snowCount, wind); else fx.wind = wind; }
    else if (fx.mode) setFx(null, 0, 0);
    lightning(k === 'thunder');

    const veiled = ['rain', 'drizzle', 'snow', 'thunder', 'fog'].includes(k);
    const visibility = veiled ? .12 : clamp(1 - cover / 115, .18, 1);
    if (isDay) {
      orb = { el: $('sun'), f: (now - sr) / (ss - sr), height: clamp(noonAltitude(now) / 66, .35, 1), opacity: visibility, glint: .75 };
    } else {
      const prevSet = now < sr ? ss - 864e5 : ss;
      const nextRise = now < sr ? sr : parseLocal(d.sunrise[1] || d.sunrise[0]) + (d.sunrise[1] ? 0 : 864e5);
      const p = moonPhase(Date.now());
      $('moon-lit').setAttribute('d', moonPath(p));
      const lit = (1 - Math.cos(2 * Math.PI * p)) / 2;
      orb = { el: $('moon'), f: clamp((now - prevSet) / (nextRise - prevSet), 0, 1), height: .62, opacity: lit < .03 ? 0 : visibility, glint: .3 * lit };
    }
    placeOrb();
  }

  /* ---------- Text panels ---------- */
  function renderNow() {
    const c = data.current, d = data.daily;
    $('temp').textContent = `${round(c.temperature_2m)}°`;
    $('cond').textContent = WMO[c.weather_code] ?? 'Unsettled';
    $('range').textContent = `High ${round(d.temperature_2m_max[0])}°, low ${round(d.temperature_2m_min[0])}°`;
    document.title = `${round(c.temperature_2m)}° ${WMO[c.weather_code] ?? ''} | Luzern weather`;
  }

  function smoothPath(pts) {
    const f = n => n.toFixed(1);
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  }

  function renderHours() {
    const h = data.hourly, now = nowLocal();
    let start = 0;
    for (let i = 0; i < h.time.length; i++) if (parseLocal(h.time[i]) <= now) start = i;
    const idx = Array.from({ length: 25 }, (_, i) => start + i).filter(i => i < h.time.length);
    const col = 58, W = idx.length * col, H = 150, top = 80, bottom = 114;
    const temps = idx.map(i => h.temperature_2m[i]);
    const lo = Math.min(...temps), hi = Math.max(...temps), span = Math.max(hi - lo, 1);
    const pts = idx.map((i, n) => [n * col + col / 2, bottom - (h.temperature_2m[i] - lo) / span * (bottom - top)]);
    const line = smoothPath(pts);
    let cols = '';
    idx.forEach((i, n) => {
      const x = n * col + col / 2;
      const label = n === 0 ? 'Now' : hhmm(h.time[i]);
      const pop = h.precipitation_probability[i];
      cols += `<text x="${x}" y="16" text-anchor="middle" font-size="13" font-weight="${n === 0 ? 600 : 400}" style="fill:${n === 0 ? 'var(--text)' : 'var(--muted)'}">${label}</text>`;
      cols += `<use href="#${iconId(h.weather_code[i], h.is_day[i])}" x="${x - 12}" y="28" width="24" height="24" style="color:var(--text)"/>`;
      cols += `<text x="${x}" y="${(pts[n][1] - 10).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="500" style="fill:var(--text)">${round(h.temperature_2m[i])}°</text>`;
      cols += `<circle cx="${x}" cy="${pts[n][1].toFixed(1)}" r="${n === 0 ? 4 : 2.2}" style="fill:var(--text)"/>`;
      if (pop >= 10) cols += `<text x="${x}" y="${H - 6}" text-anchor="middle" font-size="12.5" style="fill:var(--rain)">${pop}%</text>`;
    });
    const area = `${line}L${pts[pts.length - 1][0]} ${bottom + 12}L${pts[0][0]} ${bottom + 12}Z`;
    $('hours').innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperatures from ${round(temps[0])}° now to ${round(temps[temps.length - 1])}° in 24 hours, between ${round(lo)}° and ${round(hi)}°">
      <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#area)"/>
      <path d="${line}" fill="none" style="stroke:var(--text)" stroke-opacity=".7" stroke-width="1.5"/>
      ${cols}
    </svg>`;
  }

  const SCALE = [[-15, [154, 170, 255]], [0, [143, 211, 255]], [10, [150, 226, 196]], [20, [255, 214, 122]], [30, [255, 150, 104]], [40, [240, 92, 92]]];
  function tempColor(t) {
    if (t <= SCALE[0][0]) return `rgb(${SCALE[0][1]})`;
    for (let i = 1; i < SCALE.length; i++) {
      const [t1, c1] = SCALE[i];
      if (t <= t1) {
        const [t0, c0] = SCALE[i - 1], f = (t - t0) / (t1 - t0);
        return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * f)).join(',')})`;
      }
    }
    return `rgb(${SCALE[SCALE.length - 1][1]})`;
  }

  function renderWeek() {
    const d = data.daily;
    const lo = Math.min(...d.temperature_2m_min), hi = Math.max(...d.temperature_2m_max), span = Math.max(hi - lo, 1);
    const pos = t => ((t - lo) / span * 100).toFixed(1);
    $('week').innerHTML = d.time.map((day, i) => {
      const mn = d.temperature_2m_min[i], mx = d.temperature_2m_max[i], pop = d.precipitation_probability_max[i];
      const name = i === 0 ? 'Today' : dayFmt.format(new Date(day + 'T12:00Z'));
      const dot = i === 0 ? `<i class="dot" style="left:${pos(clamp(data.current.temperature_2m, mn, mx))}%"></i>` : '';
      return `<li class="day">
        <span class="name">${name}</span>
        ${icon(d.weather_code[i], true)}
        <span class="pop">${pop >= 20 ? pop + '%' : ''}</span>
        <span class="lo">${round(mn)}°</span>
        <span class="bar" role="img" aria-label="${WMO[d.weather_code[i]] ?? ''}, ${round(mn)}° to ${round(mx)}°"><i class="fill" style="left:${pos(mn)}%;right:${(100 - pos(mx)).toFixed(1)}%;background:linear-gradient(90deg,${tempColor(mn)},${tempColor(mx)})"></i>${dot}</span>
        <span class="hi">${round(mx)}°</span>
      </li>`;
    }).join('');
  }

  function renderFacts() {
    const c = data.current, d = data.daily;
    const dir = c.wind_direction_10m;
    const compass = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round(dir / 45) % 8];
    const uv = d.uv_index_max[0] ?? 0;
    const uvWord = uv < 3 ? 'Low' : uv < 6 ? 'Moderate' : uv < 8 ? 'High' : uv < 11 ? 'Very high' : 'Extreme';
    const arrow = `<svg class="arrow" viewBox="0 0 24 24" style="transform:rotate(${(dir + 180) % 360}deg)" aria-hidden="true"><path d="M12 3v18M6 9l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const item = (label, value, sub = '') => `<div><dt>${label}</dt><dd><span class="val">${value}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</dd></div>`;
    $('facts').innerHTML =
      item('Feels like', `${round(c.apparent_temperature)}°`) +
      item('Wind', `${round(c.wind_speed_10m)}<small>km/h</small>${arrow}`, `From the ${compass}, gusts ${round(c.wind_gusts_10m)} km/h`) +
      item('Humidity', `${round(c.relative_humidity_2m)}<small>%</small>`) +
      item('UV index today', `${round(uv)}`, uvWord) +
      item('Sunrise', hhmm(d.sunrise[0])) +
      item('Sunset', hhmm(d.sunset[0]));
  }

  function renderClock() {
    $('clock').textContent = clockFmt.format(new Date()).replace(',', '');
  }

  function render() {
    renderNow(); renderHours(); renderWeek(); renderFacts(); updateScene();
    const t = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(fetchedAt));
    $('updated').textContent = `Updated ${t}.`;
  }

  /* ---------- Loading ---------- */
  let loading = false;
  async function load() {
    if (loading) return;
    loading = true;
    try {
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
      fetchedAt = Date.now();
      $('notice').classList.remove('show');
      render();
    } catch (err) {
      $('notice').classList.add('show');
      if (!data) { $('cond').textContent = 'Forecast unavailable'; }
    } finally {
      loading = false;
    }
  }

  // Before data arrives, show a plausible sky for the time of day.
  const hourNow = new Date(nowLocal()).getUTCHours();
  applyTheme(hourNow >= 7 && hourNow < 19 ? 'cloudy' : 'nightCloudy');
  buildClouds(3);
  renderClock();

  $('retry').addEventListener('click', load);
  $('refresh').addEventListener('click', load);
  setInterval(() => {
    renderClock();
    if (data) updateScene();
    if (Date.now() - fetchedAt > REFRESH_MS) load();
  }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      renderClock();
      if (Date.now() - fetchedAt > REFRESH_MS) load(); else if (data) updateScene();
    }
  });
  new ResizeObserver(() => { placeOrb(); if (fx.mode) { sizeCanvas(); if (reduceMotion) frame(0); } }).observe($('hero'));

  load();
})();
</script>
</body>
</html>
